<script>
const DATA = [{"lesson": 1, "title": "设备控制处处在", "questions": [{"id": "L01-01", "type": "choice", "q": "小红按了一下台灯按钮，灯就亮了。这属于哪种控制？", "options": ["人工控制", "自动控制"], "answer": 0, "why": "人亲手按的开关，就是人工控制。"}, {"id": "L01-02", "type": "judge", "q": "空调发现屋里太热，自己开始制冷，这是自动控制。", "options": ["是", "否"], "answer": 0, "why": "没有人动手，设备自己判断、自己动作。"}, {"id": "L01-03", "type": "choice", "q": "手伸到水龙头下就出水，手离开就停，靠的是什么？", "options": ["人一直按着开关", "设备自己感应到"], "answer": 1, "why": "感应龙头靠传感器发现手，不用人按。"}, {"id": "L01-04", "type": "judge", "q": "全自动洗衣机选好程序后，中间不用人管也能洗完。", "options": ["是", "否"], "answer": 0, "why": "它按设定好的程序一步步做完。"}, {"id": "L01-05", "type": "choice", "q": "教室的灯要同学走过去按开关才亮，这属于？", "options": ["人工控制", "自动控制"], "answer": 0, "why": "要人动手才算数，是人工控制。"}, {"id": "L01-06", "type": "judge", "q": "只要通了电，任何设备都会自己干活。", "options": ["是", "否"], "answer": 1, "why": "很多设备要人操作，通电不等于自动。"}, {"id": "L01-07", "type": "choice", "q": "扫地机器人撞到墙会自己拐弯，说明它？", "options": ["必须有人跟在后面提醒", "能自己发现问题并调整"], "answer": 1, "why": "它自己发现障碍，自己换了方向。"}, {"id": "L01-08", "type": "judge", "q": "自动门在人走近时打开，是因为它发现了人。", "options": ["是", "否"], "answer": 0, "why": "门上的传感器发现有人，门才打开。"}, {"id": "L01-09", "type": "choice", "q": "想让电风扇左右摇头，人要做的是？", "options": ["什么都不用做", "按一下摇头键"], "answer": 1, "why": "摇头这个功能要人先按开。"}, {"id": "L01-10", "type": "judge", "q": "遥控器按下去电视一定有反应，哪怕电池没电。", "options": ["是", "否"], "answer": 1, "why": "没电就发不出信号，电视不会有反应。"}, {"id": "L01-11", "type": "choice", "q": "学校门口的测温门，人一走过就显示体温，属于？", "options": ["自动控制", "人工控制"], "answer": 0, "why": "设备自己测温、自己把结果给人看。"}, {"id": "L01-12", "type": "judge", "q": "电饭锅煮好饭会自动跳到保温，是它自己判断的。", "options": ["是", "否"], "answer": 0, "why": "它测到温度到点，自己换到保温。"}, {"id": "L01-13", "type": "choice", "q": "下面哪件事一定要人亲手做？", "options": ["电梯到楼层自己开门", "按下电梯里的楼层键"], "answer": 1, "why": "想去几楼，得人自己按。"}, {"id": "L01-14", "type": "judge", "q": "自动控制就是设备完全不用电也能自己工作。", "options": ["是", "否"], "answer": 1, "why": "自动控制照样用电，只是不用人操作。"}, {"id": "L01-15", "type": "choice", "q": "感应垃圾桶在人靠近时开盖，靠的是？", "options": ["感应到有人靠近", "有人按了按钮"], "answer": 0, "why": "桶盖上的传感器发现了人。"}, {"id": "L01-16", "type": "judge", "q": "同一台空调，既能用遥控器控制，也能自己按温度启动。", "options": ["是", "否"], "answer": 0, "why": "两种方式可以同时存在。"}]}, {"lesson": 2, "title": "一分为二开与关", "questions": [{"id": "L02-01", "type": "choice", "q": "台灯只有亮和不亮两种状态，这样的数据叫什么？", "options": ["开关量", "连续量"], "answer": 0, "why": "只有两种状态的数据，就是开关量。"}, {"id": "L02-02", "type": "judge", "q": "电风扇从 1 档慢慢调到 5 档，档位是开关量。", "options": ["是", "否"], "answer": 1, "why": "档位有好几级、可以逐渐变，不是开关量。"}, {"id": "L02-03", "type": "choice", "q": "下面哪个只有两种状态？", "options": ["屋里到底有多亮", "门是开着还是关着"], "answer": 1, "why": "门只有开和关，屋里亮度是一直在变的。"}, {"id": "L02-04", "type": "judge", "q": "水龙头要么开着要么关着，可以看成开关量。", "options": ["是", "否"], "answer": 0, "why": "开、关只有两种状态，是开关量。"}, {"id": "L02-05", "type": "choice", "q": "要记录“灯亮着”这件事，下面哪种写法合适？", "options": ["亮记 1，不亮记 0", "亮记 0.8，不亮记 0.2"], "answer": 0, "why": "开关量只有两种取值，用 1 和 0 最清楚。"}, {"id": "L02-06", "type": "judge", "q": "开关量可以用 1 表示“有”，用 0 表示“没有”。", "options": ["是", "否"], "answer": 0, "why": "1 和 0 就是开关量的两种状态。"}, {"id": "L02-07", "type": "choice", "q": "记教室门的状态，哪种记录方式最合适？", "options": ["开记 0.5，关记 1.5", "开记 1，关记 0"], "answer": 1, "why": "两种状态用两个数字记，简单又不会混。"}, {"id": "L02-08", "type": "judge", "q": "手机音量从 0 一点点调到 100，音量是开关量。", "options": ["是", "否"], "answer": 1, "why": "音量可以一点点变，是连续变化的量。"}, {"id": "L02-09", "type": "choice", "q": "电梯按钮按下去算“按了”，没按算“没按”，这是？", "options": ["连续量", "开关量"], "answer": 1, "why": "只有按下、没按下两种，是开关量。"}, {"id": "L02-10", "type": "judge", "q": "只要状态超过两种，就不算开关量。", "options": ["是", "否"], "answer": 0, "why": "开关量只有两种状态，多一种就不是。"}, {"id": "L02-11", "type": "choice", "q": "记录“窗户开着吗”，下面哪种写法合适？", "options": ["开记 1，关记 0", "开记高，关记低"], "answer": 0, "why": "开关量只有两种，用 1 和 0 最合适。"}, {"id": "L02-12", "type": "judge", "q": "冰箱门开灯就亮、关灯就灭，门的状态是开关量。", "options": ["是", "否"], "answer": 0, "why": "开和关两种状态，就是开关量。"}, {"id": "L02-13", "type": "choice", "q": "下面哪个不是开关量？", "options": ["门锁是锁上还是打开", "水温从 20 度升到 60 度"], "answer": 1, "why": "水温可以一点点升，是一直在变的量。"}, {"id": "L02-14", "type": "judge", "q": "开关量只有真和假两种情况。", "options": ["是", "否"], "answer": 1, "why": "除了真和假，还有连续变化的量。"}, {"id": "L02-15", "type": "choice", "q": "把“有没有人按门铃”记成数据，最合适的是？", "options": ["按了记 1，没按记 0", "按了记 60，没按记 30"], "answer": 0, "why": "只有两种状态，用 1 和 0 记。"}, {"id": "L02-16", "type": "judge", "q": "拉上窗帘后，屋里亮度是开关量。", "options": ["是", "否"], "answer": 1, "why": "亮度会一点点变暗，是连续变化的量。"}]}, {"lesson": 3, "title": "我是小小控制员", "questions": [{"id": "L03-01", "type": "choice", "q": "想让扫地机器人去客厅，人要先做什么？", "options": ["给它一个清楚的指令", "把它搬到客厅就行"], "answer": 0, "why": "控制要先说清楚做什么，设备才知道怎么干。"}, {"id": "L03-02", "type": "judge", "q": "控制就是人把想做的事告诉设备，让设备照着做。", "options": ["是", "否"], "answer": 0, "why": "人下指令、设备执行，这就是控制。"}, {"id": "L03-03", "type": "choice", "q": "用洗衣机洗衣服，第一步通常是？", "options": ["先按启动再选程序", "选好洗涤程序"], "answer": 1, "why": "先定好怎么洗，再按启动。"}, {"id": "L03-04", "type": "judge", "q": "设备收到指令后，做什么都一样，不用管指令内容。", "options": ["是", "否"], "answer": 1, "why": "指令不同，设备的动作也不同。"}, {"id": "L03-05", "type": "choice", "q": "做完一件事发现不对，控制员该怎么做？", "options": ["改一改再试一次", "就这样算了"], "answer": 0, "why": "看一看结果，不合适就调整，这是控制的一部分。"}, {"id": "L03-06", "type": "judge", "q": "同一个指令发给两台不同的设备，动作可能不一样。", "options": ["是", "否"], "answer": 0, "why": "每台设备的功能不同，反应也不同。"}, {"id": "L03-07", "type": "choice", "q": "遥控玩具车往前开，人按的是？", "options": ["音量键", "前进键"], "answer": 1, "why": "不同按键对应不同动作。"}, {"id": "L03-08", "type": "judge", "q": "控制员只要按下按钮，后面发生什么不用管。", "options": ["是", "否"], "answer": 1, "why": "要看结果对不对，不对还要调整。"}, {"id": "L03-09", "type": "choice", "q": "教室里要开空调降温，人该先做什么？", "options": ["先把门窗全关死再乱按", "设定想要的温度"], "answer": 1, "why": "先说清要多少度，设备才知道怎么做。"}, {"id": "L03-10", "type": "judge", "q": "步骤有先后，顺序换了结果可能就不对。", "options": ["是", "否"], "answer": 0, "why": "先做什么后做什么，会影响结果。"}, {"id": "L03-11", "type": "choice", "q": "让电饭锅开始煮饭，最后按的是？", "options": ["开始键", "保温键"], "answer": 0, "why": "选好模式后按开始，它才开始煮。"}, {"id": "L03-12", "type": "judge", "q": "设备做错了，一定是设备坏了。", "options": ["是", "否"], "answer": 1, "why": "也可能是指令给错了。"}, {"id": "L03-13", "type": "choice", "q": "想让台灯变暗一点，人应该？", "options": ["把灯罩拿掉", "调到更暗的档位"], "answer": 1, "why": "想要什么效果，就给对应的指令。"}, {"id": "L03-14", "type": "judge", "q": "控制的过程里，人可以随时停下来改主意。", "options": ["是", "否"], "answer": 0, "why": "发现不合适，随时可以调整。"}, {"id": "L03-15", "type": "choice", "q": "玩游戏时角色往左走，人按的是？", "options": ["左方向键", "右方向键"], "answer": 0, "why": "想让角色往哪走，就按哪个键。"}, {"id": "L03-16", "type": "judge", "q": "指令说得越清楚，设备越容易做对。", "options": ["是", "否"], "answer": 0, "why": "说不清楚，设备就做不到你想要的样子。"}]}, {"lesson": 4, "title": "输入输出与计算", "questions": [{"id": "L04-01", "type": "choice", "q": "自动门先发现有人，再把门打开。“发现有人”属于？", "options": ["输入", "输出"], "answer": 0, "why": "先收进来的信息，就是输入。"}, {"id": "L04-02", "type": "judge", "q": "电子秤放上东西后显示重量，显示数字属于输出。", "options": ["是", "否"], "answer": 0, "why": "把结果给人看，就是输出。"}, {"id": "L04-03", "type": "choice", "q": "空调收到“屋里 30 度”这条信息，接下来会？", "options": ["立刻停机不工作", "判断后决定要不要制冷"], "answer": 1, "why": "先算一算，再决定动不动。"}, {"id": "L04-04", "type": "judge", "q": "设备只要收到输入，就一定马上动作。", "options": ["是", "否"], "answer": 1, "why": "有的要先判断、计算，才决定怎么做。"}, {"id": "L04-05", "type": "choice", "q": "计算器按下 2 加 3 再按等号，屏幕出现 5。中间做了什么？", "options": ["做了一次加法计算", "什么都没做"], "answer": 0, "why": "它把两个数算了一下，才给出结果。"}, {"id": "L04-06", "type": "judge", "q": "传感器负责把外面的情况变成设备能用的数据。", "options": ["是", "否"], "answer": 0, "why": "温度、光线这些，都靠传感器变成数据。"}, {"id": "L04-07", "type": "choice", "q": "楼道灯听到脚步声就亮，脚步声对灯来说是？", "options": ["输出", "输入"], "answer": 1, "why": "先收到声音，才决定亮不亮。"}, {"id": "L04-08", "type": "judge", "q": "输出就是设备自己收到的那条信息。", "options": ["是", "否"], "answer": 1, "why": "收到的是输入，做出来的才是输出。"}, {"id": "L04-09", "type": "choice", "q": "红绿灯按设定时间切换，它靠什么算时间？", "options": ["路人的喊声", "内部的计时"], "answer": 1, "why": "它自己计时，到点就换灯。"}, {"id": "L04-10", "type": "judge", "q": "同一个设备可以有好几个输入。", "options": ["是", "否"], "answer": 0, "why": "比如既看光线，也看有没有声音。"}, {"id": "L04-11", "type": "choice", "q": "智能台灯发现屋里变暗就自动亮起来，“屋里变暗”是？", "options": ["输入", "输出"], "answer": 0, "why": "这是它收到的信息。"}, {"id": "L04-12", "type": "judge", "q": "设备算出来的结果，一定要给人看才算有用。", "options": ["是", "否"], "answer": 1, "why": "有的结果直接变成动作，比如开门。"}, {"id": "L04-13", "type": "choice", "q": "自动门发现人走远了就关门，“关门”属于？", "options": ["输入", "输出"], "answer": 1, "why": "动作是设备做出来的，是输出。"}, {"id": "L04-14", "type": "judge", "q": "输入、计算、输出这三步，缺一步设备也能正常工作。", "options": ["是", "否"], "answer": 1, "why": "少了哪一步都做不成。"}, {"id": "L04-15", "type": "choice", "q": "体温枪对着额头按下按钮，屏幕显示 36.5 度。计算的是？", "options": ["把测得的数据变成温度值", "把温度值变成声音"], "answer": 0, "why": "它把收到的数据算成看不懂的数字之外的温度。"}, {"id": "L04-16", "type": "judge", "q": "设备收到的信息不准确，输出的结果也可能不准。", "options": ["是", "否"], "answer": 0, "why": "输入错了，算出来自然也错。"}]}, {"lesson": 5, "title": "连续变化的数据", "questions": [{"id": "L05-01", "type": "choice", "q": "下面的数据里，哪种是慢慢变化的？", "options": ["屋里的温度", "灯是开还是关"], "answer": 0, "why": "温度会一点点升或降，是连续变化的。"}, {"id": "L05-02", "type": "judge", "q": "声音的大小可以一点点变大变小。", "options": ["是", "否"], "answer": 0, "why": "音量能从很轻到很响，中间有很多级。"}, {"id": "L05-03", "type": "choice", "q": "想看清一天里气温怎么变，用哪种图更合适？", "options": ["一高一低的柱形图", "连成一条的曲线图"], "answer": 1, "why": "连续变化用曲线看趋势最清楚。"}, {"id": "L05-04", "type": "judge", "q": "光照强度只有“亮”和“不亮”两种。", "options": ["是", "否"], "answer": 1, "why": "从很暗到很亮，中间有很多种。"}, {"id": "L05-05", "type": "choice", "q": "测噪声的仪器上显示的数值，反映的是？", "options": ["声音有多大", "声音好不好听"], "answer": 0, "why": "它测的是声音的强弱。"}, {"id": "L05-06", "type": "judge", "q": "连续变化的量，可以取任意一个中间值。", "options": ["是", "否"], "answer": 0, "why": "比如 25 度和 26 度之间还有 25.5 度。"}, {"id": "L05-07", "type": "choice", "q": "空调开后，屋里从 30 度慢慢降到 26 度，属于？", "options": ["一下变过去", "连续变化"], "answer": 1, "why": "温度是一点点降下来的。"}, {"id": "L05-08", "type": "judge", "q": "开关量和连续量可以用同一种方式记录。", "options": ["是", "否"], "answer": 1, "why": "一个只有两种值，一个有很多值。"}, {"id": "L05-09", "type": "choice", "q": "水位从低到高慢慢上升，这种数据是？", "options": ["开关量", "连续量"], "answer": 1, "why": "水位可以一点点涨，是连续量。"}, {"id": "L05-10", "type": "judge", "q": "温度计上的数字越大，表示越热。", "options": ["是", "否"], "answer": 0, "why": "温度数值就是冷热的程度。"}, {"id": "L05-11", "type": "choice", "q": "下面哪个不是连续变化的？", "options": ["门是开着还是关着", "教室里的亮度"], "answer": 0, "why": "门只有开和关两种。"}, {"id": "L05-12", "type": "judge", "q": "连续变化的量，用 1 和 0 两个数字就能记全。", "options": ["是", "否"], "answer": 1, "why": "它有很多取值，1 和 0 记不全。"}, {"id": "L05-13", "type": "choice", "q": "想让教室别太吵，设备可以测什么？", "options": ["桌椅的数量", "声音的大小"], "answer": 1, "why": "声音大小才能反映吵不吵。"}, {"id": "L05-14", "type": "judge", "q": "同一段时间里，连续量可以记录很多个数值。", "options": ["是", "否"], "answer": 0, "why": "每隔一会儿测一次，就有很多个数。"}, {"id": "L05-15", "type": "choice", "q": "把一节课的声音数据画成曲线，最可能看到？", "options": ["高低起伏的变化", "只有两个高度"], "answer": 0, "why": "声音一会儿高一会儿低。"}, {"id": "L05-16", "type": "judge", "q": "连续量只会在两个固定值之间跳。", "options": ["是", "否"], "answer": 1, "why": "它能在很大范围里连续变化。"}]}, {"lesson": 6, "title": "开关量的真与假", "questions": [{"id": "L06-01", "type": "choice", "q": "“灯亮着”这件事成立，用哪个数字表示？", "options": ["1", "0"], "answer": 0, "why": "成立记 1，不成立记 0。"}, {"id": "L06-02", "type": "judge", "q": "开关量只有真和假两种结果。", "options": ["是", "否"], "answer": 0, "why": "真就是成立，假就是不成立。"}, {"id": "L06-03", "type": "choice", "q": "把“真”变成“假”，这是哪种运算？", "options": ["与运算", "非运算"], "answer": 1, "why": "非就是反过来。"}, {"id": "L06-04", "type": "judge", "q": "“今天下雨”和“今天没下雨”，正好互为相反。", "options": ["是", "否"], "answer": 0, "why": "一个真另一个就假。"}, {"id": "L06-05", "type": "choice", "q": "门本来是关的，打开以后状态变成？", "options": ["从假变真", "还是假"], "answer": 0, "why": "“门开着”原本不成立，打开就成立了。"}, {"id": "L06-06", "type": "judge", "q": "非运算之后，真的还是真。", "options": ["是", "否"], "answer": 1, "why": "非会把真变成假。"}, {"id": "L06-07", "type": "choice", "q": "开关断开时灯不亮，这时“灯亮”这个说法是？", "options": ["真", "假"], "answer": 1, "why": "灯不亮，说法不成立，就是假。"}, {"id": "L06-08", "type": "judge", "q": "一个开关量不是真就是假，没有第三种。", "options": ["是", "否"], "answer": 0, "why": "这就是开关量的特点。"}, {"id": "L06-09", "type": "choice", "q": "声控灯没有声音时，它是？", "options": ["照样亮", "不亮"], "answer": 1, "why": "没有声音就没有输入，灯不亮。"}, {"id": "L06-10", "type": "judge", "q": "把开关量的真假反过来，可以用非运算。", "options": ["是", "否"], "answer": 0, "why": "非就是把真变假、假变真。"}, {"id": "L06-11", "type": "choice", "q": "“教室里有人的”这句话是假的，那实际情况是？", "options": ["教室里没有人", "教室里有很多人"], "answer": 0, "why": "假就是这件事不成立。"}, {"id": "L06-12", "type": "judge", "q": "真的反面可以是“不确定”。", "options": ["是", "否"], "answer": 1, "why": "开关量只有真和假两种，没有不确定。"}, {"id": "L06-13", "type": "choice", "q": "按钮没被按下时，记录成？", "options": ["1", "0"], "answer": 1, "why": "没按下就是没发生，记 0。"}, {"id": "L06-14", "type": "judge", "q": "非运算能把 0 变成 1，把 1 变成 0。", "options": ["是", "否"], "answer": 0, "why": "这就是非运算的作用。"}, {"id": "L06-15", "type": "choice", "q": "灯亮记 1，那“灯没亮”应该记成？", "options": ["0", "1"], "answer": 0, "why": "没亮就是不成立，记 0。"}, {"id": "L06-16", "type": "judge", "q": "同一个开关量，加了非运算前后，结果一定相同。", "options": ["是", "否"], "answer": 1, "why": "加非以后正好反过来。"}]}, {"lesson": 7, "title": "开关量的与运算", "questions": [{"id": "L07-01", "type": "choice", "q": "保险箱既要插钥匙、又要输对密码才开，这属于？", "options": ["与运算", "或运算"], "answer": 0, "why": "两个条件都要满足，才是与。"}, {"id": "L07-02", "type": "judge", "q": "与运算要求两个条件同时成立，结果才成立。", "options": ["是", "否"], "answer": 0, "why": "少一个都不行。"}, {"id": "L07-03", "type": "choice", "q": "登录邮箱时账号对、密码错，结果是？", "options": ["照样能进", "进不去邮箱"], "answer": 1, "why": "两个条件缺一个就进不去。"}, {"id": "L07-04", "type": "judge", "q": "双控灯只要关掉其中一个开关，灯就一定灭。", "options": ["是", "否"], "answer": 1, "why": "有些双控灯要两个都满足才亮。"}, {"id": "L07-05", "type": "choice", "q": "下面哪个是两个条件都要满足的？", "options": ["插钥匙并且输对密码才开锁", "刷卡或者投币都能进站"], "answer": 0, "why": "“并且”才是两个都要满足。"}, {"id": "L07-06", "type": "judge", "q": "与运算里，只要有一个条件不成立，结果就不成立。", "options": ["是", "否"], "answer": 0, "why": "两个都成立才成立。"}, {"id": "L07-07", "type": "choice", "q": "妈妈要求“写完作业并且收拾好书包”才能玩，哪样没做都不能玩，这是？", "options": ["非运算", "与运算"], "answer": 1, "why": "两件事都要做到，是与。"}, {"id": "L07-08", "type": "judge", "q": "按下电梯按钮电梯就运行，这属于与运算。", "options": ["是", "否"], "answer": 1, "why": "只有一个条件，不符合与的规则。"}, {"id": "L07-09", "type": "choice", "q": "两个条件都成立时，与运算的结果是？", "options": ["不成立", "成立"], "answer": 1, "why": "与运算要两个都成立才成立。"}, {"id": "L07-10", "type": "judge", "q": "与运算里条件越多，越容易满足。", "options": ["是", "否"], "answer": 1, "why": "条件越多越难同时满足。"}, {"id": "L07-11", "type": "choice", "q": "手机既要人脸对上、又要按一下确认才解锁，缺少一样会怎样？", "options": ["解不开锁", "照样解开"], "answer": 0, "why": "两个条件都要有。"}, {"id": "L07-12", "type": "judge", "q": "与运算的两个条件，可以先看一个再看另一个。", "options": ["是", "否"], "answer": 0, "why": "有一个不成立，就能判断结果不成立。"}, {"id": "L07-13", "type": "choice", "q": "教室里“开灯并且拉上窗帘”才看得清投影，只开灯不拉窗帘会怎样？", "options": ["一样很清楚", "还是看不清"], "answer": 1, "why": "两个条件缺一个，效果就达不到。"}, {"id": "L07-14", "type": "judge", "q": "与运算就是两个条件里满足一个就行。", "options": ["是", "否"], "answer": 1, "why": "那是或运算。"}, {"id": "L07-15", "type": "choice", "q": "跑步机要通电并且按下开始才转，只通电会怎样？", "options": ["不转", "马上转起来"], "answer": 0, "why": "两个条件都满足它才动。"}, {"id": "L07-16", "type": "judge", "q": "与运算的结果，只有两个条件都成立时才成立。", "options": ["是", "否"], "answer": 0, "why": "这是与运算的规则。"}]}, {"lesson": 8, "title": "开关量的或运算", "questions": [{"id": "L08-01", "type": "choice", "q": "进地铁站，刷卡或者刷手机，有一种就能进。这属于？", "options": ["或运算", "与运算"], "answer": 0, "why": "满足其中一个就行，是或运算。"}, {"id": "L08-02", "type": "judge", "q": "或运算里，只要有一个条件成立，结果就成立。", "options": ["是", "否"], "answer": 0, "why": "不用两个都满足。"}, {"id": "L08-03", "type": "choice", "q": "密码或者指纹，有一种对了就能开门，这属于？", "options": ["非运算", "或运算"], "answer": 1, "why": "有一种成立就够了。"}, {"id": "L08-04", "type": "judge", "q": "爸爸或者妈妈任意一人来接都可以，这符合或运算。", "options": ["是", "否"], "answer": 0, "why": "只要有一个人来就行。"}, {"id": "L08-05", "type": "choice", "q": "或运算的两个条件都不成立时，结果是？", "options": ["不成立", "仍然成立"], "answer": 0, "why": "一个都没满足，结果不成立。"}, {"id": "L08-06", "type": "judge", "q": "或运算要求两个条件必须同时成立。", "options": ["是", "否"], "answer": 1, "why": "那说的是与运算。"}, {"id": "L08-07", "type": "choice", "q": "楼道灯听到声音或者有人经过都会亮，这属于？", "options": ["与运算", "或运算"], "answer": 1, "why": "两个办法任选一个都能亮。"}, {"id": "L08-08", "type": "judge", "q": "或运算里，两个条件都成立，结果反而不成立。", "options": ["是", "否"], "answer": 1, "why": "都成立结果当然成立。"}, {"id": "L08-09", "type": "choice", "q": "公交车上刷卡或者投币都能坐车，这属于？", "options": ["与运算", "或运算"], "answer": 1, "why": "两种方式有一样就行。"}, {"id": "L08-10", "type": "judge", "q": "或运算比与运算更容易满足。", "options": ["是", "否"], "answer": 0, "why": "只要一个条件成立就够了。"}, {"id": "L08-11", "type": "choice", "q": "手机可以用密码解锁，也可以用人脸解锁，这属于？", "options": ["或运算", "与运算"], "answer": 0, "why": "两种方式任选一种。"}, {"id": "L08-12", "type": "judge", "q": "或运算里，只要两个条件都不满足，结果一定不成立。", "options": ["是", "否"], "answer": 0, "why": "一个都没满足，就办不成。"}, {"id": "L08-13", "type": "choice", "q": "两个条件里只满足一个，或运算的结果是？", "options": ["不成立", "成立"], "answer": 1, "why": "满足一个就够。"}, {"id": "L08-14", "type": "judge", "q": "或运算和与运算的规则完全一样。", "options": ["是", "否"], "answer": 1, "why": "一个要都满足，一个满足一样就行。"}, {"id": "L08-15", "type": "choice", "q": "自行车用钥匙开或者用密码锁开，都能骑走，这属于？", "options": ["或运算", "与运算"], "answer": 0, "why": "任一种方式开锁就行。"}, {"id": "L08-16", "type": "judge", "q": "想同时用到两种进门方式，就该用与运算而不是或运算。", "options": ["是", "否"], "answer": 0, "why": "都要满足才进，那是与运算。"}]}, {"lesson": 9, "title": "从人工到自动化", "questions": [{"id": "L09-01", "type": "choice", "q": "城市路灯天黑时齐刷刷亮起来，这属于？", "options": ["自动控制", "人工控制"], "answer": 0, "why": "没有人去按开关，路灯自己按时或按光线亮。"}, {"id": "L09-02", "type": "judge", "q": "家里的灯要人走过去按开关才亮，属于人工控制。", "options": ["是", "否"], "answer": 0, "why": "有人动手才算控制。"}, {"id": "L09-03", "type": "choice", "q": "妈妈炒菜时用手把火调小，这是？", "options": ["自动控制", "人工控制"], "answer": 1, "why": "人自己看着调，是人工控制。"}, {"id": "L09-04", "type": "judge", "q": "自动控制的设备不需要电也能工作。", "options": ["是", "否"], "answer": 1, "why": "自动控制照样要用电，只是不用人操作。"}, {"id": "L09-05", "type": "choice", "q": "空调按设定温度自己运行，靠的是？", "options": ["按规则或程序自动运行", "人每隔一会儿手动调"], "answer": 0, "why": "设好程序，它自己判断、自己调。"}, {"id": "L09-06", "type": "judge", "q": "城市路灯几乎同时亮，是按时间或光线自动控制的。", "options": ["是", "否"], "answer": 0, "why": "它们听统一的时间或光线安排。"}, {"id": "L09-07", "type": "choice", "q": "让设备自动干活，通常要先做的是？", "options": ["什么都不用准备", "设定好规则或程序"], "answer": 1, "why": "没有规则，设备不知道该怎么做。"}, {"id": "L09-08", "type": "judge", "q": "只要装了自动设备，人就完全不用管了。", "options": ["是", "否"], "answer": 1, "why": "还要人设定、检查、偶尔处理故障。"}, {"id": "L09-09", "type": "choice", "q": "自动浇花器每天定时浇水，属于？", "options": ["人工控制", "自动控制"], "answer": 1, "why": "按设定时间自己浇。"}, {"id": "L09-10", "type": "judge", "q": "人工控制和自动控制不能出现在同一个家里。", "options": ["是", "否"], "answer": 1, "why": "同一个家里两种都有很正常。"}, {"id": "L09-11", "type": "choice", "q": "扫地机器人自己跑完整个房间，说明它？", "options": ["能按程序自己完成", "必须人一直推着走"], "answer": 0, "why": "它按设定路线自己跑。"}, {"id": "L09-12", "type": "judge", "q": "扫地机器人能按程序自己跑完整个房间。", "options": ["是", "否"], "answer": 0, "why": "这是自动控制。"}, {"id": "L09-13", "type": "choice", "q": "下面哪件事目前还得靠人判断？", "options": ["到点自动打铃", "菜咸淡合不合口"], "answer": 1, "why": "好不好吃要人尝，机器判断不了。"}, {"id": "L09-14", "type": "judge", "q": "自动控制做得再好，人也完全没必要检查和调整。", "options": ["是", "否"], "answer": 1, "why": "设备也会出错，人还要看一眼。"}, {"id": "L09-15", "type": "choice", "q": "学校广播到点自动放铃声，属于？", "options": ["自动控制", "人工控制"], "answer": 0, "why": "到点自己响，不用人去按。"}, {"id": "L09-16", "type": "judge", "q": "从人工到自动化，人做的事变成了设定和检查。", "options": ["是", "否"], "answer": 0, "why": "人从动手变成定规则、看结果。"}]}, {"lesson": 10, "title": "开环控制应用广", "questions": [{"id": "L10-01", "type": "choice", "q": "闹钟到点就响，不管你起没起床，这属于？", "options": ["开环控制", "闭环控制"], "answer": 0, "why": "它不问结果，只管按时间响。"}, {"id": "L10-02", "type": "judge", "q": "开环控制没有反馈，输出结果不会影响后面的控制。", "options": ["是", "否"], "answer": 0, "why": "它做完就算完，不看效果。"}, {"id": "L10-03", "type": "choice", "q": "汽车定速巡航会一直测车速并自动加油门，这属于？", "options": ["闭环控制", "开环控制"], "answer": 1, "why": "它测车速、和设定值比，是闭环。"}, {"id": "L10-04", "type": "judge", "q": "定时闹钟会根据你有没有起床，决定要不要再响一次。", "options": ["是", "否"], "answer": 1, "why": "闹钟不知道你起没起，只按时间响。"}, {"id": "L10-05", "type": "choice", "q": "开环控制最大的特点是？", "options": ["输出不影响控制过程", "能自己发现并纠正错误"], "answer": 0, "why": "没有反馈，就没法纠正。"}, {"id": "L10-06", "type": "judge", "q": "按预设程序放烟花，观众喊得再响也不会改顺序。", "options": ["是", "否"], "answer": 0, "why": "它只按程序走，不听现场声音。"}, {"id": "L10-07", "type": "choice", "q": "下面哪个是开环控制？", "options": ["空调按室温自己调", "按时间自动打铃"], "answer": 1, "why": "打铃不看结果，是开环。"}, {"id": "L10-08", "type": "judge", "q": "开环控制的精度很高，能自己纠正偏差。", "options": ["是", "否"], "answer": 1, "why": "没有反馈，纠不了偏差。"}, {"id": "L10-09", "type": "choice", "q": "感应垃圾桶只看有没有人靠近，不看桶满没满，属于？", "options": ["闭环控制", "开环控制"], "answer": 1, "why": "它只收一个信号，不看结果。"}, {"id": "L10-10", "type": "judge", "q": "触摸灯按下后亮一段时间自己灭，不管楼道亮不亮。", "options": ["是", "否"], "answer": 0, "why": "它不测亮度，属于开环。"}, {"id": "L10-11", "type": "choice", "q": "开环控制容易受外界影响，是因为？", "options": ["它不知道结果对不对", "它的零件太少"], "answer": 0, "why": "没有反馈，出了偏差自己发现不了。"}, {"id": "L10-12", "type": "judge", "q": "开环控制因为结构简单，所以特别贵。", "options": ["是", "否"], "answer": 1, "why": "开环结构简单，一般还更便宜。"}, {"id": "L10-13", "type": "choice", "q": "想让开环控制更准，通常要？", "options": ["让它自己看着办", "把设定值定得更细"], "answer": 1, "why": "没有反馈，只能靠事先定得准。"}, {"id": "L10-14", "type": "judge", "q": "电热水壶按设定加热到 100 度断电，不看水的初温。", "options": ["是", "否"], "answer": 0, "why": "它按固定策略走，属于开环。"}, {"id": "L10-15", "type": "choice", "q": "洗衣机按固定程序洗完就停，不管衣服脏不脏，属于？", "options": ["开环控制", "闭环控制"], "answer": 0, "why": "它不看洗得干不干净。"}, {"id": "L10-16", "type": "judge", "q": "开环控制能自动发现结果不对，再重做一遍。", "options": ["是", "否"], "answer": 1, "why": "那需要反馈，是闭环做的事。"}]}, {"lesson": 11, "title": "借助反馈提效果", "questions": [{"id": "L11-01", "type": "choice", "q": "倒水时看杯子快满了就停手，靠的是？", "options": ["反馈", "开环控制"], "answer": 0, "why": "看到水位的结果，再决定停不停。"}, {"id": "L11-02", "type": "judge", "q": "反馈是把输出的结果送回输入端。", "options": ["是", "否"], "answer": 0, "why": "结果回到前面，才能影响下一步。"}, {"id": "L11-03", "type": "choice", "q": "作业发回来订正错误，属于？", "options": ["没有任何反馈", "借助反馈改进"], "answer": 1, "why": "看到错在哪，下次才改得对。"}, {"id": "L11-04", "type": "judge", "q": "闹钟到点响一次，属于反馈。", "options": ["是", "否"], "answer": 1, "why": "闹钟不知道结果，不算反馈。"}, {"id": "L11-05", "type": "choice", "q": "微波炉叮了但饭还是凉的，你会再热一次，这是？", "options": ["人发现结果不对再调整", "设备自己反馈"], "answer": 0, "why": "人看到了结果，再让它重来。"}, {"id": "L11-06", "type": "judge", "q": "菜淡了再加点盐，是人在用反馈调整。", "options": ["是", "否"], "answer": 0, "why": "尝过之后才知道再加多少。"}, {"id": "L11-07", "type": "choice", "q": "反馈信息从哪里来？", "options": ["随便编的数字", "输出产生的结果"], "answer": 1, "why": "反馈必须是真实结果。"}, {"id": "L11-08", "type": "judge", "q": "只要按了开关灯亮，就是反馈在起作用。", "options": ["是", "否"], "answer": 1, "why": "那是开环，开关不知道灯亮没亮。"}, {"id": "L11-09", "type": "choice", "q": "下面哪个不是反馈？", "options": ["尝一口汤觉得淡再加盐", "按下开关灯就亮"], "answer": 1, "why": "按开关没有任何结果信息回来。"}, {"id": "L11-10", "type": "judge", "q": "老师看学生表情调整讲法，是获取反馈。", "options": ["是", "否"], "answer": 0, "why": "从学生反应里得到信息，据此调整。"}, {"id": "L11-11", "type": "choice", "q": "医生看 X 光片判断病情，属于？", "options": ["获取反馈信息", "输出控制信号"], "answer": 0, "why": "片子是检查结果，是反馈信息。"}, {"id": "L11-12", "type": "judge", "q": "反馈只可能由机器完成，人不能提供反馈。", "options": ["是", "否"], "answer": 1, "why": "人看到结果再调整，也是反馈。"}, {"id": "L11-13", "type": "choice", "q": "没有反馈的控制，最大问题是？", "options": ["一定马上坏掉", "不知道自己做得对不对"], "answer": 1, "why": "没有结果信息，就无法纠正。"}, {"id": "L11-14", "type": "judge", "q": "倒水时看水位快满了就少倒一点，靠的是反馈。", "options": ["是", "否"], "answer": 0, "why": "水位就是结果信息。"}, {"id": "L11-15", "type": "choice", "q": "设备自己测温度并调整火力，这属于？", "options": ["设备自动反馈", "人给的反馈"], "answer": 0, "why": "它自己测、自己调，不用人管。"}, {"id": "L11-16", "type": "judge", "q": "有反馈的系统一定不会出错。", "options": ["是", "否"], "answer": 1, "why": "反馈能减少偏差，但不能保证永不出错。"}]}, {"lesson": 12, "title": "闭环控制促稳定", "questions": [{"id": "L12-01", "type": "choice", "q": "空调把房间稳定在 26 度，属于？", "options": ["闭环控制", "开环控制"], "answer": 0, "why": "它一直测室温，不够就补冷。"}, {"id": "L12-02", "type": "judge", "q": "闭环控制有反馈，能根据结果调整。", "options": ["是", "否"], "answer": 0, "why": "这就是闭环的关键。"}, {"id": "L12-03", "type": "choice", "q": "闭环和开环最大的区别是？", "options": ["设备贵不贵", "有没有反馈"], "answer": 1, "why": "看结果会不会回到前面。"}, {"id": "L12-04", "type": "judge", "q": "开环控制有反馈回路，能自己纠正偏差。", "options": ["是", "否"], "answer": 1, "why": "开环没有反馈。"}, {"id": "L12-05", "type": "choice", "q": "恒温热水器一直测水温并调火力，属于？", "options": ["闭环控制", "开环控制"], "answer": 0, "why": "它靠测得的水温来调。"}, {"id": "L12-06", "type": "judge", "q": "空调把房间稳定在 26 度，是因为它一直测室温。", "options": ["是", "否"], "answer": 0, "why": "测得准才控得稳。"}, {"id": "L12-07", "type": "choice", "q": " hy": "这就是常说的模块划分。"}, {"id": "L15-07", "type": "choice", "q": "噪声监测系统里测噪声的那部分属于？", "options": ["显示屏", "数据监测子系统里的模块"], "answer": 1, "why": "它负责采集，是监测子系统的一块。"}, {"id": "L15-08", "type": "judge", "q": "模块之间不能组合，只能单独用。", "options": ["是", "否"], "answer": 1, "why": "模块可以拼起来组成系统。"}, {"id": "L15-09", "type": "choice", "q": "模块的特点是？", "options": ["只能固定不动", "可以组合、可以替换"], "answer": 1, "why": "拼装灵活是模块的价值。"}, {"id": "L15-10", "type": "judge", "q": "微波炉里有磁控管、定时等模块。", "options": ["是", "否"], "answer": 0, "why": "一件一块，各管一样。"}, {"id": "L15-11", "type": "choice", "q": "图书阅览室的噪声监测系统可以分成？", "options": ["监测子系统和显示子系统", "只有一块屏幕"], "answer": 0, "why": "一个采集，一个显示。"}, {"id": "L15-12", "type": "judge", "q": "模块越多，系统一定越差。", "options": ["是", "否"], "answer": 1, "why": "关键看设计得合不合理。"}, {"id": "L15-13", "type": "choice", "q": "同一块显示屏既能用在阅览室也能用在教室，说明模块？", "options": ["只能专用", "通用性好"], "answer": 1, "why": "能换地方用，说明通用。"}, {"id": "L15-14", "type": "judge", "q": "同样的模块可以装到不同的系统里。", "options": ["是", "否"], "answer": 0, "why": "通用模块省成本。"}, {"id": "L15-15", "type": "choice", "q": "想给系统加个新功能，模块化设计让人？", "options": ["加一个模块就行", "必须重做整个系统"], "answer": 0, "why": "插一块新模块最省事。"}, {"id": "L15-16", "type": "judge", "q": "模块化设计让维修变得更麻烦。", "options": ["是", "否"], "answer": 1, "why": "模块化恰恰让维修更简单。"}]}];
const S = { lesson: DATA[0] ? DATA[0].lesson : 1, ans: true, c: true, j: true, kw: '' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderNav() {
  document.getElementById('nav').innerHTML = DATA.map(d =>
    `<div class="li${d.lesson === S.lesson ? ' on' : ''}" data-l="${d.lesson}"><i>${String(d.lesson).padStart(2,'0')}</i>${esc(d.title)}<span>${d.questions.length}</span></div>`
  ).join('');
}

function match(q) {
  if (q.type === 'choice' && !S.c) return false;
  if (q.type === 'judge' && !S.j) return false;
  if (S.kw) {
    const t = (q.q + (q.options||[]).join('') + (q.why||'')).toLowerCase();
    if (t.indexOf(S.kw.toLowerCase()) < 0) return false;
  }
  return true;
}

function renderBody() {
  const d = DATA.find(x => x.lesson === S.lesson);
  if (!d) return;
  const show = d.questions.filter(match);
  document.getElementById('body').innerHTML =
    `<h2 class="lt">第 ${d.lesson} 课 · ${esc(d.title)}</h2>
     <div class="ls">${d.questions.length} 题${show.length !== d.questions.length ? ' · 当前筛选出 ' + show.length + ' 题' : ''}</div>` +
    (show.length ? show.map(q => {
      const isJ = q.type === 'judge';
      return `<div class="q">
        <div class="qh"><span class="tag ${isJ ? 'j' : ''}">${isJ ? '判断' : '选择'}</span><span class="tag m">${q.id}</span></div>
        <div class="stem">${esc(q.q)}</div>
        <div class="opts">${q.options.map((o, i) =>
          `<div class="opt${S.ans && i === q.answer ? ' right' : ''}"><b>${isJ ? '·' : String.fromCharCode(65 + i)}</b><span>${esc(o)}</span></div>`
        ).join('')}</div>
        <div class="why${S.ans ? '' : ' hide'}">${esc(q.why || '')}</div>
      </div>`;
    }).join('') : '<div class="empty">这个课次没有匹配的题目</div>');
}

document.getElementById('nav').addEventListener('click', e => {
  const li = e.target.closest('.li');
  if (!li) return;
  S.lesson = Number(li.dataset.l);
  renderNav(); renderBody(); window.scrollTo(0, 0);
});
document.getElementById('kw').addEventListener('input', e => { S.kw = e.target.value.trim(); renderBody(); });
document.getElementById('btnAns').onclick = e => { S.ans = !S.ans; e.target.classList.toggle('on', S.ans); renderBody(); };
document.getElementById('btnC').onclick = e => { S.c = !S.c; e.target.classList.toggle('on', S.c); renderBody(); };
document.getElementById('btnJ').onclick = e => { S.j = !S.j; e.target.classList.toggle('on', S.j); renderBody(); };

renderNav(); renderBody();
</script>
</body>
</html>
